name: CI

on:
    push:
        branches:
            - "main"
    pull_request:
        branches:
            - "*"

jobs:
    lint:
        runs-on: ${{ matrix.os }}
        env:
            MIX_ENV: dev
        name: Lint
        strategy:
            matrix:
                os: ["ubuntu-latest"]
                elixir: ["1.20"]
                otp: ["29"]
        steps:
            - uses: actions/checkout@v7
            - uses: erlef/setup-beam@v1
              with:
                  otp-version: ${{ matrix.otp }}
                  elixir-version: ${{ matrix.elixir }}
            - uses: actions/cache@v6
              with:
                  path: deps
                  key: ${{ matrix.os }}-otp_${{ matrix.otp }}-elixir_${{ matrix.elixir }}-mix_${{ hashFiles('**/mix.lock') }}
                  restore-keys: ${{ matrix.os }}-otp_${{ matrix.otp }}-elixir_${{ matrix.elixir }}-mix_
            - run: mix deps.get
            - run: mix deps.compile
            - run: mix format --check-formatted
            - run: clang-format --dry-run --Werror c_src/sqlite3_nif.c
            - run: mix deps.unlock --check-unused
            - run: mix credo --all

    test:
        runs-on: ${{ matrix.os }}
        env:
            MIX_ENV: test
            DEBUG: "1"

        name: Test Elixir ${{ matrix.elixir }}, OTP ${{ matrix.otp }}, OS ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: ["ubuntu-latest"]
                elixir: ["1.20", "1.19", "1.18"]
                otp: ["29", "28", "27"]
                exclude:
                    - elixir: "1.19"
                      otp: "29"
                    - elixir: "1.18"
                      otp: "29"
                include:
                    - os: "windows-2022"
                      otp: "29"
                      elixir: "1.20"

        steps:
            - uses: actions/checkout@v7
            - uses: erlef/setup-beam@v1
              with:
                  otp-version: ${{ matrix.otp }}
                  elixir-version: ${{ matrix.elixir }}

            - uses: ilammy/msvc-dev-cmd@v1
              if: matrix.os == 'windows-2022'
              with:
                  arch: x64

            - uses: actions/cache@v6
              with:
                  path: deps
                  key: ${{ matrix.os }}-otp_${{ matrix.otp }}-elixir_${{ matrix.elixir }}-mix_${{ hashFiles('**/mix.lock') }}
                  restore-keys: ${{ matrix.os }}-otp_${{ matrix.otp }}-elixir_${{ matrix.elixir }}-mix_
            - run: mix deps.get --only test
            - run: mix deps.compile
            - run: mix compile
            - name: Test with Erlang allocator
              run: mix test
              env:
                  EXQLITE_DISABLE_ERLANG_ALLOCATOR: "false"
            - name: Test without Erlang allocator
              run: mix test
              env:
                  EXQLITE_DISABLE_ERLANG_ALLOCATOR: "true"

    c-check:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: erlef/setup-beam@v1
              with:
                  otp-version: "29"
                  elixir-version: "1.20"
            - run: sudo apt-get update && sudo apt-get install -y clang
            - run: make c-check

    c-sanitizers:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        env:
            MIX_ENV: test
        steps:
            - uses: actions/checkout@v7
            - uses: erlef/setup-beam@v1
              with:
                  otp-version: "29"
                  elixir-version: "1.20"
            - run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev llvm
            - run: mix deps.get
            # No arguments: the script runs the full test/ suite.
            - run: sh scripts/test-c-sanitizers.sh
